<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABSENKU Camera</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      border-radius: 16px;
      background: #000;
      display: block;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #1f2937;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📷 ABSENKU</h1>

    <video
      id="video"
      autoplay
      playsinline>
    </video>

    <button
      id="btnFoto"
      type="button">
      📸 AMBIL FOTO
    </button>

    <div id="status">
      ⏳ Menyiapkan kamera...
    </div>

    <canvas id="canvas"></canvas>

  </div>

  <script>

    let cameraStream = null;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const btnFoto = document.getElementById("btnFoto");


    async function mulaiKamera() {

      try {

        status.textContent =
          "⏳ Meminta izin kamera...";

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "Browser tidak mendukung akses kamera."
          );

        }


        cameraStream =
          await navigator.mediaDevices.getUserMedia({

            video: true,

            audio: false

          });


        video.srcObject =
          cameraStream;


        await video.play();


        status.textContent =
          "🟢 Kamera siap digunakan.";

        console.log(
          "KAMERA BERHASIL AKTIF"
        );


      } catch (error) {

        console.error(
          "ERROR KAMERA:",
          error
        );

        status.textContent =
          "❌ " +
          error.name +
          ": " +
          error.message;

      }

    }


    btnFoto.addEventListener(
      "click",
      function() {

        if (
          !cameraStream ||
          video.videoWidth === 0
        ) {

          alert(
            "Kamera belum siap."
          );

          return;

        }


        canvas.width =
          video.videoWidth;

        canvas.height =
          video.videoHeight;


        const context =
          canvas.getContext("2d");


        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const foto =
          canvas.toDataURL(
            "image/jpeg",
            0.8
          );


        status.textContent =
          "🟢 Foto berhasil diambil.";


        console.log(
          "FOTO BERHASIL DIAMBIL"
        );


        if (
  window.opener &&
  !window.opener.closed
) {

  window.opener.postMessage(
    {
      type: "ABSENKU_FOTO",
      foto: foto
    },
    "*"
  );
setTimeout(function() {
  window.close();
}, 300);
  console.log(
    "🟢 FOTO BERHASIL DIKIRIM KE ABSENKU"
  );

} else {

  console.log(
    "🔴 ABSENKU TIDAK DITEMUKAN"
  );

}


        if (
          window.parent &&
          window.parent !== window
        ) {

          window.parent.postMessage(

            {
              type: "ABSENKU_FOTO",
              foto: foto
            },

            "*"

          );

        }

      }
    );


    document.addEventListener(
      "DOMContentLoaded",
      function() {

        mulaiKamera();

      }
    );

  </script>

</body>
</html>
